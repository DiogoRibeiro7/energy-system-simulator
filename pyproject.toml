[tool.poetry]
name = "energy-system-simulator"
version = "0.1.0"
description = "Transparent simulation and unit commitment for hybrid electricity systems"
authors = ["Diogo Ribeiro <diogo_dj@hotmail.com>"]
readme = "README.md"
license = "BUSL-1.1"
packages = [{ include = "energy_system_simulator", from = "src" }]
include = [
  { path = "LICENSE", format = ["sdist", "wheel"] },
  { path = "COMMERCIAL-LICENSE.md", format = ["sdist", "wheel"] },
  { path = "LICENSING.md", format = ["sdist", "wheel"] },
  { path = "NOTICE", format = ["sdist", "wheel"] },
  { path = "RELEASES.md", format = ["sdist", "wheel"] },
  { path = "licensing/releases.json", format = ["sdist", "wheel"] },
  { path = "licensing/metadata.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26,<3.0"
pandas = ">=2.1,<4.0"
scipy = ">=1.11,<2.0"
PyYAML = ">=6.0,<7.0"
matplotlib = ">=3.8,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<7.0"
ruff = ">=0.8,<1.0"
mypy = ">=1.10,<2.0"
pandas-stubs = ">=2.1,<3.0"
pre-commit = ">=3.7,<5.0"

[tool.poetry.scripts]
energy-sim = "energy_system_simulator.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "yaml"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["energy_system_simulator"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "raise RuntimeError\\(",
]
