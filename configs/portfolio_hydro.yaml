schema_version: 2

scenario:
  id: hydro-seasonal-example

simulation:
  time_step_hours: 1.0

solver:
  solver_time_limit_seconds: 60.0
  mip_relative_gap: 0.001
  allow_non_optimal_solution: false

fuels:
  - id: gas
    price_eur_per_mwh_thermal: 35.0
    co2_factor_tonnes_per_mwh_thermal: 0.18

zones:
  - id: system

buses:
  - id: system
    zone_id: system

lines: []

aggregate_network:
  loss_fraction: 0.04
  transfer_capacity_mw: 500.0

renewable_generators:
  - id: solar
    kind: solar
    bus_id: system
    capacity_mw: 90.0
    performance_ratio: 0.86
    reference_irradiance_w_m2: 1000.0
    temperature_coefficient_per_c: -0.004
    nominal_operating_cell_temperature_c: 45.0
    time_series_key: irradiance_w_m2
    ambient_temperature_key: ambient_temperature_c
  - id: wind
    kind: wind
    bus_id: system
    capacity_mw: 110.0
    cut_in_speed_m_s: 3.0
    rated_speed_m_s: 12.0
    cut_out_speed_m_s: 25.0
    time_series_key: wind_speed_m_s

thermal_generators:
  - id: gas-ccgt
    bus_id: system
    fuel_id: gas
    name: Gas combined-cycle plant
    minimum_output_mw: 25.0
    maximum_output_mw: 180.0
    ramp_up_mw_per_hour: 90.0
    ramp_down_mw_per_hour: 90.0
    startup_ramp_mw: 180.0
    shutdown_ramp_mw: 180.0
    variable_cost_eur_per_mwh: 82.0
    no_load_cost_eur_per_hour: 500.0
    startup_cost_eur: 4500.0
    shutdown_cost_eur: 500.0
    emission_factor_tonnes_per_mwh: 0.36
    minimum_fuel_input_mwh_per_hour: 50.0
    heat_rate_segments:
      - id: main
        capacity_mw: 155.0
        heat_rate_mwh_thermal_per_mwh: 2.1
    minimum_up_hours: 2.0
    minimum_down_hours: 1.0
    initial_on: true
    initial_output_mw: 50.0
    initial_up_time_hours: 3.0
    initial_down_time_hours: 0.0
    terminal_commitment_mode: forbid_incomplete_transitions

storage_units:
  - id: battery
    bus_id: system
    technology: battery
    energy_capacity_mwh: 160.0
    power_capacity_mw: 60.0
    charge_power_capacity_mw: 60.0
    discharge_power_capacity_mw: 60.0
    minimum_soc_mwh: 16.0
    maximum_soc_mwh: 160.0
    initial_soc_mwh: 80.0
    charge_efficiency: 0.94
    discharge_efficiency: 0.94
    self_discharge_rate_per_hour: 0.0001
    throughput_cost_eur_per_mwh: 1.5
    minimum_final_soc_mwh: 60.0
    terminal_soc_mode: minimum

hydro_units:
  - id: alpine-reservoir
    kind: reservoir
    bus_id: system
    inflow_time_series_key: reservoir_inflow_mw_water
    minimum_reservoir_mwh: 80.0
    maximum_reservoir_mwh: 800.0
    initial_reservoir_mwh: 420.0
    minimum_final_reservoir_mwh: 360.0
    terminal_reservoir_mode: minimum
    turbine_capacity_mw: 85.0
    turbine_efficiency: 0.9
    spill_capacity_mw: 120.0
    minimum_release_mw: 8.0
    evaporation_rate_per_hour: 0.00005
    water_value_eur_per_mwh: 8.0
  - id: river-run
    kind: run_of_river
    bus_id: system
    inflow_time_series_key: river_inflow_mw_water
    turbine_capacity_mw: 35.0
    turbine_efficiency: 0.88
    spill_capacity_mw: 80.0
    minimum_release_mw: 5.0
    upstream_hydro_id: alpine-reservoir
    cascade_delay_hours: 2.0

imports:
  - id: market
    bus_id: system
    maximum_power_mw: 70.0
    price_eur_per_mwh: 125.0
    emission_factor_tonnes_per_mwh: 0.22

demand:
  - id: system-demand
    bus_id: system
    time_series_key: demand_mw

penalties:
  renewable_curtailment_eur_per_mwh: 1.0
  lost_load_eur_per_mwh: 10000.0
  carbon_price_eur_per_tonne: 85.0

paths:
  input_csv: ../data/hydro_seasonal_hourly.csv
  output_directory: ../outputs/portfolio-hydro
