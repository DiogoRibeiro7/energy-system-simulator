name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install "poetry>=1.8,<3"
      - name: Install dependencies
        run: poetry install
      - name: Formatting
        run: poetry run ruff format --check .
      - name: Lint
        run: poetry run ruff check .
      - name: Type check
        run: poetry run mypy src
      - name: Release metadata
        run: poetry run python scripts/validate_licensing.py
      - name: Version metadata
        run: poetry run python scripts/validate_version.py
      - name: Example data reproducibility
        run: poetry run python scripts/check_example_data.py
      - name: Example dry-run validation
        run: poetry run python scripts/validate_examples.py
      - name: Test
        run: poetry run pytest --cov=energy_system_simulator --cov-report=term-missing
      - name: Core coverage
        run: poetry run coverage report --include="src/energy_system_simulator/dispatch/*" --fail-under=90
      - name: Example validation
        run: poetry run energy-sim validate --config configs/example.yaml
      - name: Example simulation
        run: poetry run energy-sim simulate --config configs/example.yaml --no-plots
      - name: Benchmark
        run: poetry run python scripts/benchmark_example.py
      - name: Baseline comparison
        run: poetry run python scripts/compare_baseline.py
      - name: Release readiness
        run: poetry run python scripts/validate_release_readiness.py
      - name: Editable install smoke
        run: poetry run python scripts/smoke_editable_install.py
      - name: Build package
        run: poetry build
      - name: Wheel install smoke
        run: poetry run python scripts/smoke_wheel_install.py
